    <script>
      // Ensure window.fetch has both a getter and setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _nativeFetch = window.fetch;
          if (typeof _nativeFetch === 'function') {
            _nativeFetch = _nativeFetch.bind(window);
          }
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _nativeFetch;
            },
            set: function(fn) {
              _nativeFetch = typeof fn === 'function' ? fn.bind(window) : fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Graceful fallback if window.fetch cannot be redefined
        }
      })();
    </script>
